{% extends 'base.html' %}

{% block title %}Edit Student - Practical 21{% endblock %}

{% block content %}
<section class="page-banner">
  <h1>Edit Student</h1>
  <p>Practical 21: Update Student Record</p>
</section>

<div class="card-wrapper">
  <div class="portal-card">
    <h2 class="card-title">Edit Student Details</h2>
    <p class="card-subtitle">Updating Record for ID: <strong>#{{ student.id }}</strong></p>

    <form method="POST">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" value="{{ student.name }}" required>
      </div>

      <div class="form-group">
        <label for="course">Course</label>
        <select id="course" name="course" class="form-control" required>
          {% for course in courses %}
            <option value="{{ course.id }}" {% if student.course.id == course.id %}selected{% endif %}>
              {{ course.course_name }} ({{ course.course_code }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email ID</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ student.email }}" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="text" id="mobile" name="mobile" class="form-control" value="{{ student.mobile }}" required>
      </div>

      <div class="form-group">
        <label for="city">City</label>
        <input type="text" id="city" name="city" class="form-control" value="{{ student.city }}" required>
      </div>

      <button type="submit" class="btn-submit">Update Student</button>
    </form>

    <div style="margin-top:1.5rem; text-align:center;">
      <a href="{% url 'student_list' %}" class="btn btn-outline" style="color:#0284c7; border-color:#0284c7;">← Cancel &amp; Return</a>
    </div>
  </div>
</div>
{% endblock %}
